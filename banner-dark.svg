<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Gerardo "Jerry" Medina</title>
  <desc id="desc">CS at Cal State Fullerton and founder of Stelta. Builds TypeScript backends, open-source developer tools, and Roblox games.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b949e" opacity="0.18"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="typing"><rect x="237" y="40" width="0" height="40"><animate attributeName="width" values="0;11;22;33;44;55;70" keyTimes="0;0.17;0.33;0.5;0.67;0.83;1" calcMode="discrete" dur="0.9s" begin="0.4s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { font-size: 18px; fill: #7ee787; }
    .cmd { font-size: 18px; fill: #e6edf3; }
    .name { font-size: 54px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.5px; }
    .sub { font-size: 22px; fill: #8b949e; }
    .rot { font-size: 19px; fill: #e6edf3; opacity: 0; }
    .caret { fill: #7ee787; }
    .label { font-size: 12px; fill: #8b949e; }
    .edge { fill: none; stroke: #30363d; stroke-width: 1.6; }
    .node { fill: #0d1117; stroke: #58a6ff; stroke-width: 2.4; }
    .halo { fill: none; stroke: #58a6ff; stroke-width: 1.5; opacity: 0;
             transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-out infinite; }
    .packet { fill: #7ee787; }
    .packet.p2 { fill: #58a6ff; }
    .cursor { fill: #7ee787; animation: blink 1s step-end infinite; }
    .r0 { animation: cycle 15s linear 0s infinite; }
    .r1 { animation: cycle 15s linear 3s infinite; }
    .r2 { animation: cycle 15s linear 6s infinite; }
    .r3 { animation: cycle 15s linear 9s infinite; }
    .r4 { animation: cycle 15s linear 12s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.4); } }
    @keyframes cycle {
      0%, 17% { opacity: 1; transform: none; }
      20%, 96% { opacity: 0; transform: translateY(-8px); }
      97% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rot, .halo, .cursor, .packet { animation: none; }
      .r0 { opacity: 1; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text class="mono prompt" x="64" y="68">jerry@github:~$</text>
  <text class="mono cmd" x="237" y="68" clip-path="url(#typing)">whoami</text>
  <rect class="cursor" x="239" y="52" width="10" height="20" rx="1"><animate attributeName="x" values="239;250;261;272;283;294;306" keyTimes="0;0.17;0.33;0.5;0.67;0.83;1" calcMode="discrete" dur="0.9s" begin="0.4s" fill="freeze"/></rect>

  <text class="sans name" x="62" y="140">Gerardo “Jerry” Medina</text>
  <text class="sans sub" x="64" y="186">CS @ Cal State Fullerton · Founder of Stelta</text>
    <text class="mono rot r0" x="64" y="250"><tspan class="caret">&gt;</tspan> 1st place at the LPL Financial Hackathon</text>
    <text class="mono rot r1" x="64" y="250"><tspan class="caret">&gt;</tspan> 25M+ visits on Roblox games I led</text>
    <text class="mono rot r2" x="64" y="250"><tspan class="caret">&gt;</tspan> MetricHouse: 1,400+ npm downloads</text>
    <text class="mono rot r3" x="64" y="250"><tspan class="caret">&gt;</tspan> 1st place + $6K grant for Nested</text>
    <text class="mono rot r4" x="64" y="250"><tspan class="caret">&gt;</tspan> Filed Workers Builds bug #80 with Cloudflare</text>

  <g>
    <path id="e0" class="edge" d="M825,250 Q868.6,183.8 860,105"/>
    <path id="e1" class="edge" d="M860,105 Q928.8,110.0 985,70"/>
    <path id="e2" class="edge" d="M985,70 Q945.9,123.7 950,190"/>
    <path id="e3" class="edge" d="M950,190 Q876.7,197.5 825,250"/>
    <path id="e4" class="edge" d="M985,70 Q1040.4,115.4 1112,115"/>
    <path id="e5" class="edge" d="M1112,115 Q1068.6,172.8 1072,245"/>
    <path id="e6" class="edge" d="M950,190 Q1001.1,239.5 1072,245"/>
    <path id="e7" class="edge" d="M825,250 Q898.3,242.5 950,190"/>
  </g>
  <g>
    <circle r="3.5" class="packet "><animateMotion dur="2.6s" begin="-0.0s" repeatCount="indefinite" rotate="auto"><mpath href="#e0" xlink:href="#e0"/></animateMotion></circle>
    <circle r="3.5" class="packet p2"><animateMotion dur="2.2s" begin="-0.8s" repeatCount="indefinite" rotate="auto"><mpath href="#e1" xlink:href="#e1"/></animateMotion></circle>
    <circle r="3.5" class="packet "><animateMotion dur="2.4s" begin="-1.4s" repeatCount="indefinite" rotate="auto"><mpath href="#e4" xlink:href="#e4"/></animateMotion></circle>
    <circle r="3.5" class="packet p2"><animateMotion dur="2.0s" begin="-0.4s" repeatCount="indefinite" rotate="auto"><mpath href="#e5" xlink:href="#e5"/></animateMotion></circle>
    <circle r="3.5" class="packet "><animateMotion dur="2.8s" begin="-2.0s" repeatCount="indefinite" rotate="auto"><mpath href="#e2" xlink:href="#e2"/></animateMotion></circle>
    <circle r="3.5" class="packet p2"><animateMotion dur="3.0s" begin="-1.0s" repeatCount="indefinite" rotate="auto"><mpath href="#e6" xlink:href="#e6"/></animateMotion></circle>
    <circle r="3.5" class="packet "><animateMotion dur="2.6s" begin="-2.6s" repeatCount="indefinite" rotate="auto"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
    <circle r="3.5" class="packet p2"><animateMotion dur="3.2s" begin="-0.2s" repeatCount="indefinite" rotate="auto"><mpath href="#e7" xlink:href="#e7"/></animateMotion></circle>
  </g>
  <g>
    <g><circle class="halo" cx="825" cy="250" r="9" style="animation-delay:0.00s"/><circle class="node" cx="825" cy="250" r="7"/><text class="mono label" x="825" y="276" text-anchor="middle">/home</text></g>
    <g><circle class="halo" cx="860" cy="105" r="9" style="animation-delay:0.45s"/><circle class="node" cx="860" cy="105" r="7"/><text class="mono label" x="860" y="131" text-anchor="middle">/login</text></g>
    <g><circle class="halo" cx="985" cy="70" r="9" style="animation-delay:0.90s"/><circle class="node" cx="985" cy="70" r="7"/><text class="mono label" x="985" y="96" text-anchor="middle">/events</text></g>
    <g><circle class="halo" cx="950" cy="190" r="9" style="animation-delay:1.35s"/><circle class="node" cx="950" cy="190" r="7"/><text class="mono label" x="950" y="216" text-anchor="middle">/search</text></g>
    <g><circle class="halo" cx="1112" cy="115" r="9" style="animation-delay:1.80s"/><circle class="node" cx="1112" cy="115" r="7"/><text class="mono label" x="1112" y="141" text-anchor="middle">/checkout</text></g>
    <g><circle class="halo" cx="1072" cy="245" r="9" style="animation-delay:2.25s"/><circle class="node" cx="1072" cy="245" r="7"/><text class="mono label" x="1072" y="271" text-anchor="middle">/tickets</text></g>
  </g>
</svg>
